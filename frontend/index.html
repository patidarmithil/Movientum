<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Movientum" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Movientum — Discover, rate, and track movies with privacy-preserving federated AI recommendations." />
    <meta name="keywords" content="movies, tv shows, recommendations, federated AI, privacy-preserving, movie tracking, movie ratings, Movientum, cinema" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Movientum" />
    <link rel="canonical" href="https://movientum.vercel.app/" />
    <script>
      (function() {
        var path = window.location.pathname;
        if (path !== '/' && path !== '/intro' && path !== '/about') {
          var meta = document.querySelector('meta[name="robots"]');
          if (meta) {
            meta.setAttribute('content', 'noindex, nofollow');
          } else {
            meta = document.createElement('meta');
            meta.name = 'robots';
            meta.content = 'noindex, nofollow';
            document.head.appendChild(meta);
          }
        }
      })();
    </script>
    <!-- Early page-bundle fetch. On a direct load or refresh of /movies/:id or
         /tv/:id, the bundle request starts here instead of after the JS entry
         chunk has downloaded and React has mounted (~0.3-0.6 s later), and the
         backdrop (the LCP image) is preloaded the moment its path is known.
         pageService.getMovie/getTV consumes window.__mvEarlyPage once; any
         failure or mismatch falls back to the normal api.js request, which
         keeps the failover and 401-refresh handling. Crawlers are skipped for
         the same reason api.js blocks them. -->
    <script>
      (function () {
        try {
          var m = window.location.pathname.match(/^\/(movies|tv)\/(\d+)\/?$/);
          if (!m || !window.fetch) return;
          if (/googlebot|bingbot|yandexbot|baiduspider|duckduckbot|yahoo! slurp|sogou|exabot|ia_archiver|facebot|facebookexternalhit|twitterbot|pinterest|slackbot|telegrambot|whatsapp/i.test(navigator.userAgent || '')) return;
          var host = window.location.hostname;
          var base = '%VITE_API_URL%';
          if (!base || base.charAt(0) === '%') {
            base = (host === 'localhost' || host === '127.0.0.1' || host === '[::1]')
              ? 'http://localhost:8000' : 'https://movientum.azurewebsites.net';
          }
          // Same token lookup as utils/storage.js; an expired session sends no token.
          var token = null;
          var exp = localStorage.getItem('mv_login_expires_at');
          if (!exp || Date.now() <= parseInt(exp, 10)) {
            token = sessionStorage.getItem('mv_access_token') || localStorage.getItem('mv_access_token');
          }
          var mt = m[1] === 'movies' ? 'movie' : 'tv';
          // No Content-Type on a GET: it would force a CORS preflight for guests.
          var headers = {};
          if (token) headers.Authorization = 'Bearer ' + token;
          var p = fetch(base + '/api/v1/pages/' + mt + '/' + m[2], { headers: headers })
            .then(function (r) { if (!r.ok) throw new Error('early ' + r.status); return r.json(); });
          window.__mvEarlyPage = { key: mt + ':' + m[2], promise: p };
          p.then(function (data) {
            var b = data && data.detail && data.detail.backdrop_path;
            if (!b) return;
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'image';
            l.href = 'https://image.tmdb.org/t/p/w1280' + b;
            l.setAttribute('fetchpriority', 'high');
            document.head.appendChild(l);
          }).catch(function () {});
        } catch (e) { /* fall back to the in-app request */ }
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://movientum.vercel.app/" />
    <meta property="og:title" content="Movientum — Your Movies, Your Way" />
    <meta property="og:description" content="Discover, rate, and track movies with privacy-preserving federated AI recommendations." />
    <meta property="og:site_name" content="Movientum" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://movientum.vercel.app/" />
    <meta name="twitter:title" content="Movientum — Your Movies, Your Way" />
    <meta name="twitter:description" content="Discover, rate, and track movies with privacy-preserving federated AI recommendations." />
    
    <title>Movientum — Your Movies, Your Way</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm the TCP + TLS handshakes for the origins every page needs, so the
         first API call and the first poster do not pay for them. The API origin
         is the deployed backend; a local dev build overrides it via VITE_API_URL
         and simply never uses this hint. -->
    <link rel="preconnect" href="https://movientum.azurewebsites.net" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- The backdrop trailer player, loaded only when a trailer exists. -->
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <!-- Logged-out visitors resolve their country here before the guest
         recommendation rail can be requested, so warm the connection early. -->
    <link rel="dns-prefetch" href="https://get.geojs.io" />
    <!-- Non-blocking font load: as a plain stylesheet this sat in the critical
         path and held up first paint on every visit. It swaps itself to the
         real media once downloaded; the noscript copy keeps it working with
         JavaScript disabled. `display=swap` already prevents invisible text. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <meta name="google-site-verification" content="AUDJ78xhzpQJzefgpwCcNUWJyXzRvjLF6J3KTHJDJkc" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Movientum",
      "url": "https://movientum.vercel.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://movientum.vercel.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Movientum",
      "url": "https://movientum.vercel.app",
      "logo": "https://movientum.vercel.app/logo.png"
    }
    </script>
    
    <!-- Umami Analytics removed in favor of dynamic loader -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
